name: Validate Unified Remote Wayland Fix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFI test tools and native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libevdev2 libxkbcommon0 libdbus-1-3 xkb-data
      - name: Validate installer and behavior
        run: |
          bash -n install.sh
          python3 -m unittest discover -s tests -v
